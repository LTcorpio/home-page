<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body class="no-select">
  <!-- 壁纸与遮罩 -->
  <div class="wallpaper" id="wallpaper"></div>
  <div class="mask" id="mask"></div>

  <!-- 右上角浮动条：访问地址切换 + 手动探测刷新 + 管理入口(仅管理员) -->
  <div class="float-bar">
    <button class="net-chip" id="netMode" title="点击切换访问地址模式">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span id="netModeText">自动</span>
    </button>
    <button class="float-btn" id="refreshBtn" title="立即探测一次并刷新状态">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    </button>
    <a class="float-btn" id="adminLink" href="/admin" title="管理后台" style="display:none">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </div>

  <div class="scroll-wrap">
  <div class="page">
    <!-- 头部：仅日期与时间 -->
    <div class="header" id="header">
      <div class="clock text-shadow">
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-date"><span id="clockDate">---</span> <span id="clockWeek">-</span></div>
      </div>
    </div>

    <!-- 分组与卡片 -->
    <main class="board" id="board">
      <div class="empty">加载中…</div>
    </main>
  </div>
  </div>

  <!-- 卡片右键菜单：容器启停 + 备注（管理员） -->
  <div class="ctx-menu" id="ctxMenu" style="display:none"></div>

  <!-- 备注查看浮层（管理员右键菜单进入） -->
  <div class="memo-mask" id="memoMask" style="display:none">
    <div class="memo-pop">
      <div class="memo-head"><span id="memoTitle">备注</span><button class="memo-close" id="memoClose" title="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button></div>
      <div class="memo-body" id="memoBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/assets/home.js"></script>
</body>
</html>
